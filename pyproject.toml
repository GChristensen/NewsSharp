[project]
name = "newssharp"
version = "0.1.0"
description = "NewsSharp - a personal lightweight RSS reader"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "uvicorn>=0.30",
    "whitenoise>=6.7",
    "python-dotenv>=1.0",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "python-dateutil>=2.9",
    "lxml>=5.3",
    "lxml_html_clean>=0.4",
    "nh3>=0.2.18",
    "trafilatura>=2.0",
    "readability-lxml>=0.8.1",
    "pillow>=10.4",
    "numpy>=2.0",
    "psutil>=6.0",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
