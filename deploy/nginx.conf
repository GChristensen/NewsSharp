# nginx reverse proxy for NewsSharp (deploy/nginx.conf): TLS and HTTP/2 are left to nginx.
# NewsSharp listens on plain HTTP; set in its config.yaml:
#   bind: 127.0.0.1
#   port: 10000
#   trust_proxy: true
# Adjust server_name, the ports and the certificate paths.

server {
    listen 80;
    server_name news;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name news;

    ssl_certificate     /etc/nginx/certs/news.crt;
    ssl_certificate_key /etc/nginx/certs/news.key;

    # WebSub pushes are accepted up to 10 MB; OPML imports are smaller.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NewsSharp takes the first address of X-Forwarded-For as the client (login throttling),
        # so it is overwritten rather than appended to: a client cannot supply its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # Live updates (server-sent events): unbuffered, long-lived.
    location = /api/events {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
